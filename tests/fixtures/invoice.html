<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic public API invoice</title>
    <style>
      /* The browser lays out this bounded fixture before the library measures it. */
      body {
        margin: 0;
      }
      #invoice {
        box-sizing: border-box;
        width: 960px;
        padding: 12px;
        color: #17263a;
        background: white;
        font: 14px/1.5 'Invoice Sans';
      }
      h1,
      p {
        margin: 0 0 12px;
      }
      h1 {
        font-size: 24px;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .parties {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 16px;
      }
      .party {
        border: 1px solid #a7b1be;
        padding: 12px;
      }
      .accent {
        font-family: 'Invoice Accent';
        font-style: italic;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 2px;
      }
      th,
      td {
        border: 1px solid #a7b1be;
        padding: 5px 8px;
        text-align: left;
      }
      .stamp {
        width: 270px;
        padding: 12px;
        margin-top: 16px;
        background: linear-gradient(110deg, #e4eefb, #f5e8ff);
        border-radius: 8px;
      }
      .footer {
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <!-- Fictional names and totals keep browser evidence safe to retain locally. -->
    <main id="invoice">
      <div class="heading">
        <h1>Test invoice TEST 001</h1>
        <img id="invoice-logo" width="48" height="32" alt="Synthetic colored logo" />
      </div>
      <div class="parties">
        <div class="party">
          <p><strong>Supplier: Sample Company (Unicode: &#x010d;)</strong></p>
          <p>12 Sample Street, Test City</p>
        </div>
        <div class="party">
          <p><strong>Customer: Example Client</strong></p>
          <p class="accent">
            Unicode accents:
            &#x00e1;&#x010d;&#x010f;&#x00e9;&#x011b;&#x00ed;&#x0148;&#x00f3;&#x0159;&#x0161;&#x0165;&#x00fa;&#x016f;&#x00fd;&#x017e;.
          </p>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Description</th>
            <th>Verification marker</th>
          </tr>
        </thead>
        <tbody id="invoice-rows">
          <!-- Synthetic rows are added by the browser test before measurement. -->
        </tbody>
      </table>
      <div class="stamp" data-raster>Raster confirmation is present.</div>
      <p class="footer"><strong>End of the test invoice.</strong></p>
    </main>
  </body>
</html>
