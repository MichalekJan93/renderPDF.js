<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic legacy statement</title>
    <style>
      /* Intentionally retain legacy FONT markup to exercise browser-measured table layout. */
      font.normal {
        font-family: Tahoma;
        font-size: 9pt;
      }
      font.normalBold {
        font-family: Tahoma;
        font-size: 9pt;
        font-weight: bold;
      }
      font.header {
        font-family: Tahoma;
        font-size: 12pt;
      }
    </style>
  </head>
  <body>
    <!-- All content is synthetic; this fixture contains no real statement information. -->
    <table border="0" width="100%">
      <tr>
        <td width="160" rowspan="2"><font class="normalBold">Test document &#x010d;</font></td>
        <td colspan="2"><font class="normal">Spanning-cell example</font></td>
      </tr>
      <tr>
        <td><font class="normal">Sample number:</font></td>
        <td><font class="normal">TEST 000</font></td>
      </tr>
    </table>
    <br /><br />
    <center><font class="header">Test account statement</font></center>
    <p>
      <font class="normal"
        >Unicode accents:
        &#x00e1;&#x010d;&#x010f;&#x00e9;&#x011b;&#x00ed;&#x0148;&#x00f3;&#x0159;&#x0161;&#x0165;&#x00fa;&#x016f;&#x00fd;&#x017e;.</font
      >
    </p>
    <p><font class="normalBold">Summary of test periods:</font></p>
    <table border="0" width="100%">
      <tr>
        <td width="90"><font class="normalBold">Identifier</font></td>
        <td width="85"><font class="normalBold">Period from</font></td>
        <td width="85"><font class="normalBold">Period to</font></td>
        <td width="45" align="right"><font class="normalBold">Days</font></td>
        <td><font class="normalBold">Period type</font></td>
        <td width="90" align="right"><font class="normalBold">Check</font></td>
      </tr>
      <!-- SYNTHETIC_ROWS -->
    </table>
    <p><font class="normalBold">End of the test statement.</font></p>
  </body>
</html>
