<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Example document</title>
    <style>
      body {
        color: #263b50;
        font-size: 16px;
        line-height: 1.6;
        padding: 24px;
      }
      h1 {
        font-size: 30px;
        line-height: 1.3;
        margin: 0 0 20px;
      }
      h2 {
        font-size: 24px;
        margin: 0 0 16px;
      }
      p {
        margin: 0 0 16px;
      }
      .card {
        padding: 20px;
        margin: 24px 0;
        border-radius: 12px;
        background: linear-gradient(120deg, #dceefe, #e6f6e7);
      }
      .second-page {
        break-before: page;
      }
    </style>
  </head>
  <body>
    <h1>Your HTML document as a PDF</h1>
    <p>
      Unicode sample:
      &#x011B;&#x0161;&#x010D;&#x0159;&#x017E;&#x00FD;&#x00E1;&#x00ED;&#x00E9;&#x016F;&#x00FA;&#x010F;&#x0165;&#x0148;&#x00F3;&#x010C;.
    </p>
    <p><strong>Bold text</strong> and <em>italic text</em> remain selectable.</p>
    <div class="card">
      <p>The gradient card uses a local raster capture.</p>
      <p>Its text remains searchable too.</p>
    </div>
    <section class="second-page">
      <h2>Second page</h2>
      <p>Edit the HTML in the left panel and download another PDF.</p>
    </section>
  </body>
</html>
