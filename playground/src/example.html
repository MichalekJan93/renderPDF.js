<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>Ukázkový dokument</title>
    <style>
      body {
        color: #263b50;
        font-size: 16px;
        line-height: 1.6;
        padding: 24px;
      }
      h1 {
        font-size: 30px;
        line-height: 1.3;
        margin: 0 0 20px;
      }
      h2 {
        font-size: 24px;
        margin: 0 0 16px;
      }
      p {
        margin: 0 0 16px;
      }
      .card {
        padding: 20px;
        margin: 24px 0;
        border-radius: 12px;
        background: linear-gradient(120deg, #dceefe, #e6f6e7);
      }
      .second-page {
        break-before: page;
      }
    </style>
  </head>
  <body>
    <h1>Váš HTML dokument v PDF</h1>
    <p>Příliš žluťoučký kůň úpěl ďábelské ódy.</p>
    <p><strong>Tučný text</strong> a <em>kurzíva</em> zůstávají vybíratelné.</p>
    <div class="card">
      <p>Gradientová karta používá místní rastrové vykreslení.</p>
      <p>Její český text je také vyhledatelný.</p>
    </div>
    <section class="second-page">
      <h2>Druhá stránka</h2>
      <p>HTML můžete upravit v levém panelu a stáhnout nové PDF.</p>
    </section>
  </body>
</html>
