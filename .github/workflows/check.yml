name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Static, unit, browser, build and package checks
        run: npm run check
      - name: Pack the verified library for the independent consumer
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
      - name: Verify the packed playground consumer
        working-directory: playground
        run: |
          npm uninstall renderpdf-js
          npm install ../artifacts/renderpdf-js-0.0.0.tgz
          npm run check
      - name: Reproducible export samples
        run: npm run benchmark
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rendering-and-benchmark-evidence
          path: |
            test-results/
            playwright-report/
            playground/test-results/
            playground/playwright-report/
            artifacts/benchmarks/
            artifacts/benchmarks-report.json
          if-no-files-found: ignore
          retention-days: 14
