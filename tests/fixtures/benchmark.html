<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>RenderPDF.js export benchmark</title>
    <style>
      body {
        margin: 0;
      }
      #source {
        width: 720px;
        color: #172b4d;
        background: white;
        font: 14px / 1.5 'Benchmark Sans';
        font-synthesis: none;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 400;
      }
      p {
        margin: 0 0 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 80px 1fr 100px;
        gap: 8px;
        padding: 6px;
        border: 1px solid #cbd5e1;
        break-inside: avoid;
      }
      .raster {
        margin: 12px 0;
        padding: 16px;
        border-radius: 12px;
        background: linear-gradient(90deg, #dceaff, #edf8f1);
      }
    </style>
  </head>
  <body>
    <main id="source"></main>
    <script type="module" src="./benchmark.ts"></script>
  </body>
</html>
